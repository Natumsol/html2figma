      body { margin: 24px; }

      #geometry { position: relative; height: 180px; }

      #geometry .red { position: absolute; left: 152px; top: 16px; width: 152px; height: 80px; background: rgb(220, 40, 60); opacity: 0.6; }

      #typography .caption { margin-top: 8px; font-size: 16px; line-height: 24px; }
      #flex-reverse, #flex-absolute { position: relative; display: flex; height: 120px; gap: 12px; padding: 16px; }
      #flex-reverse { flex-direction: row-reverse; }
      #flex-reverse div, #flex-absolute div { width: 64px; height: 48px; background: rgb(20, 80, 220); }
      #flex-reverse div + div { background: rgb(20, 160, 100); }
      #flex-absolute .badge { position: absolute; left: 180px; top: 60px; background: rgb(220, 40, 60); }
      #media { position: relative; height: 160px; }
      #media img { position: absolute; left: 16px; top: 16px; width: 128px; height: 128px; object-fit: cover; }
    </style>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Browser to Figma visual acceptance</title>
    <style>
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        src: url('/__e2e/inter-latin-400-normal.woff2') format('woff2');
      }
      body { margin: 24px; }
      section { box-sizing: border-box; margin-bottom: 24px; width: 320px; background: white; }
      #geometry { position: relative; height: 180px; }
      #geometry .blue { position: absolute; left: 16px; top: 16px; width: 120px; height: 80px; background: rgb(20, 80, 220); border-radius: 12px; }
      #geometry .red { position: absolute; left: 152px; top: 16px; width: 152px; height: 80px; background: rgb(220, 40, 60); opacity: 0.6; }
      #geometry svg { position: absolute; left: 16px; top: 112px; width: 40px; height: 40px; }
      #flex-border { height: 180px; display: flex; padding: 16px; gap: 12px; border-top: 4px solid rgb(20, 80, 220); }
      #flex-border div { width: 80px; height: 100px; background: rgb(20, 160, 100); }
      #typography { height: 120px; padding: 16px; color: rgb(15, 23, 42); font-family: Inter, sans-serif; }
      #typography p { margin: 0; font-size: 24px; line-height: 32px; }
      #typography .caption { margin-top: 8px; font-size: 16px; line-height: 24px; }
    </style>
  </head>
  <body>
    <section id="geometry">
      <div class="blue"></div><div class="red"></div>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#14a064" /></svg>
    </section>
    <section id="flex-border"><div></div><div></div><div></div></section>
    <section id="typography"><p>Browser to Figma</p><p class="caption">Editable text layers</p></section>
  </body>
</html>

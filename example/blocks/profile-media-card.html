<section class="h2f-profile-card">
  <style>
    .h2f-profile-card {
      box-sizing: border-box;
      width: 460px;
      padding: 24px;
      border-radius: 30px;
      background: rgb(15, 23, 42);
      color: rgb(255, 255, 255);
      font-family: Inter, Arial, sans-serif;
      box-shadow: rgba(15, 23, 42, 0.28) 0px 22px 52px 0px;
    }

    .h2f-profile-card-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .h2f-profile-card-avatar {
      display: block;
      width: 132px;
      height: 132px;
      border-radius: 24px;
    }

    .h2f-profile-card-content {
      width: 250px;
    }

    .h2f-profile-card-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: rgb(125, 211, 252);
      font-size: 13px;
      font-weight: 800;
    }

    .h2f-profile-card-status svg {
      width: 16px;
      height: 16px;
    }

    .h2f-profile-card-title {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 30px;
      font-weight: 800;
    }

    .h2f-profile-card-copy {
      margin: 0;
      color: rgb(203, 213, 225);
      font-size: 14px;
      line-height: 22px;
    }
  </style>
  <div class="h2f-profile-card-row">
    <img class="h2f-profile-card-avatar" src="/media/portrait-preview.png" alt="Profile illustration"/>
    <div class="h2f-profile-card-content">
      <div class="h2f-profile-card-status">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="8" fill="rgb(34, 197, 94)"/>
          <path d="M6.5 10.4L8.8 12.7L13.8 7.7" stroke="rgb(255, 255, 255)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        READY TO SYNC
      </div>
      <h2 class="h2f-profile-card-title">Image plus SVG icon</h2>
      <p class="h2f-profile-card-copy">Combine local image assets with inline vector icons in one flex-based card.</p>
    </div>
  </div>
</section>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basic Card Fixture</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: rgb(245, 245, 245);
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 240px;
        padding: 16px;
        background: rgb(255, 255, 255);
        border: 1px solid rgb(220, 220, 220);
        border-radius: 12px;
        box-shadow: rgba(0, 0, 0, .2) 0px 4px 12px;
      }

      .title {
        font-size: 20px;
        line-height: 28px;
        font-weight: 700;
        color: rgb(20, 20, 20);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Hello Figma</div>
    </div>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">html2figma — Frame Shift</title>
  <desc id="desc">Two offset rounded frames overlap into a violet editable layer.</desc>
  <defs>
    <clipPath id="source-frame">
      <rect x="16" y="16" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>
  <rect x="16" y="16" width="56" height="56" rx="14" fill="#FF7237"/>
  <rect x="28" y="28" width="56" height="56" rx="14" fill="#00B6FF"/>
  <rect x="28" y="28" width="56" height="56" rx="14" fill="#874FFF" clip-path="url(#source-frame)"/>
  <rect x="60" y="60" width="14" height="14" rx="4" fill="#24CB71"/>
</svg>
